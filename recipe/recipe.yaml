# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.2.1"
  maturin_min: "1.5.1"
  python_check_max: "3.14"

package:
  name: pyproject-fmt-rust
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/pyproject-fmt-rust/pyproject_fmt_rust-${{ version }}.tar.gz
  sha256: ff4b41f35a1e571ae07a890269c716c202c4d832a427ad2ef488527b55a20fe2

build:
  number: 2
  skip: is_abi3 and not is_python_min
  python:
    version_independent: ${{ is_abi3 }}
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO: cargo-auditable-wrapper${{ ".bat" if win }}
      PYTHONIOENCODING: utf-8
      PYTHONLEGACYTEXTENCODING: utf-8
    content:
      - if: win
        then:
          - copy "%RECIPE_DIR%\cargo-auditable-wrapper.bat" "%BUILD_PREFIX%\Library\bin\cargo-auditable-wrapper.bat"
        else:
          - cp "${RECIPE_DIR}/cargo-auditable-wrapper.sh" "${BUILD_PREFIX}/bin/cargo-auditable-wrapper"
          - chmod 755 "${BUILD_PREFIX}/bin/cargo-auditable-wrapper"
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check
      - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ compiler("rust") }}
    - ${{ stdlib("c") }}
    - cargo-auditable
    - cargo-bundle-licenses
  host:
    - maturin >=${{ maturin_min }}
    - pip
    - python
    - if: is_abi3
      then:
        - python-abi3
  run:
    - python

tests:
  - python:
      imports: pyproject_fmt_rust
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - files:
      source:
        - tests/
    requirements:
      run:
        - coverage
        - pytest >=8.2
        - if: is_abi3
          then:
            - abi3audit
            - python !=${{ python_min }}.*
    script:
      - coverage run --source=pyproject_fmt_rust -m pytest -vv --tb=long --color=yes
      - coverage report --show-missing --skip-covered --fail-under=100
      - if: is_abi3
        then:
          - cd ${{ "$SP_DIR" if unix else "%SP_DIR%" }}/pyproject_fmt_rust
          - abi3audit -s -v --assume-minimum-abi3 ${{ python_min }} _lib.${{ "abi3.so" if unix else "pyd" }}

about:
  summary: Format your pyproject.toml file
  license: MIT
  license_file:
    - LICENSE.txt
    - THIRDPARTY.yml
  homepage: https://pypi.org/project/pyproject-fmt-rust
  repository: https://github.com/tox-dev/pyproject-fmt-rust

extra:
  recipe-maintainers:
    - bollwyvl
